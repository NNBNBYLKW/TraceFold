<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceFold Stage 5C-C visual matrix</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --ink: #1d2126;
  --muted: #5d6672;
  --line: #d7dce3;
  --accent: #2f6f9f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a1e;
    --panel: #20252b;
    --ink: #e8ecf1;
    --muted: #a7b0bb;
    --line: #343b44;
    --accent: #7fb6dd;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 "Segoe UI", Arial, sans-serif;
}
h1 { margin: 0 0 8px; font-size: 22px; }
h2 { margin: 28px 0 6px; font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
h3 { margin: 18px 0 4px; font-size: 15px; }
h4 { margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
p.meta { margin: 2px 0; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--panel); margin: 6px 0 12px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: color-mix(in srgb, var(--panel) 82%, var(--line)); font-weight: 600; }
td.state { font-weight: 600; }
td.status-Passed { color: #1f7a3f; font-weight: 600; }
td.status-Failed { color: #b02a2a; font-weight: 600; }
td.status-Blocked { color: #8a5a00; font-weight: 600; }
td.status-NotRun { color: var(--muted); font-weight: 600; }
img.shot { display: block; max-width: 320px; max-height: 200px; border: 1px solid var(--line); background: #000; }
a { color: var(--accent); }
code { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
.empty { color: var(--muted); font-style: italic; }
.banner {
  margin: 10px 0 4px;
  padding: 10px 12px;
  border: 1px solid #b08a00;
  border-left-width: 6px;
  border-radius: 4px;
  background: #fff6d6;
  color: #4a3a00;
  font-weight: 600;
}
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border: 1px solid #b08a00;
  border-radius: 999px;
  background: #fff6d6;
  color: #4a3a00;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
</style>
</head>
<body>
<h1>TraceFold Stage 5C-C visual matrix</h1>
<div id="banner" class="banner" hidden></div>
<p class="meta" id="summary"></p>
<div id="matrix"></div>
<script type="application/json" id="screenshots-data">__SCREENSHOTS_JSON__</script>
<script>
(function () {
  "use strict";
  var dataNode = document.getElementById("screenshots-data");
  var host = document.getElementById("matrix");
  var summary = document.getElementById("summary");
  var data = JSON.parse(dataNode.textContent);
  var entries = Array.isArray(data.entries) ? data.entries : [];

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function group(values, key) {
    // A plain object inherits names such as constructor, __proto__ and toString, so a theme with
    // one of those names would index an inherited member instead of an array. A null-prototype map
    // has no inherited members: every string is just a key, and the guard keeps the first write.
    var map = Object.create(null);
    var order = [];
    values.forEach(function (entry) {
      var raw = entry[key];
      var name = String(raw === undefined || raw === null ? "unknown" : raw);
      if (!Object.prototype.hasOwnProperty.call(map, name)) { map[name] = []; order.push(name); }
      map[name].push(entry);
    });
    return order.map(function (name) { return { name: name, items: map[name] }; });
  }

  function threeState(value) {
    if (value === true) { return "true"; }
    if (value === false) { return "false"; }
    return "unknown";
  }

  function renderEntry(entry) {
    var row = element("tr");
    row.appendChild(element("td", "state", entry.state));
    var status = element("td", "status-" + String(entry.status), entry.status);
    row.appendChild(status);
    var imageCell = element("td");
    if (entry.image) {
      var link = element("a");
      link.href = String(entry.image);
      link.target = "_blank";
      var image = element("img", "shot");
      image.src = String(entry.image);
      image.alt = String(entry.theme) + " " + String(entry.viewport) + " " + String(entry.state);
      link.appendChild(image);
      imageCell.appendChild(link);
    } else {
      imageCell.appendChild(element("span", "empty", "no image"));
    }
    row.appendChild(imageCell);
    var facts = element("td");
    if (entry.synthetic === true) {
      facts.appendChild(element("span", "badge", "Synthetic"));
    }
    facts.appendChild(element("div", null, "client " + entry.clientWidth + " x " + entry.clientHeight + " px"));
    facts.appendChild(element("div", null, "DPI " + entry.dpi));
    facts.appendChild(element("div", null, "product " + String(entry.productHash || "").slice(0, 12)));
    facts.appendChild(element("div", null, "captured " + entry.capturedUtc));
    row.appendChild(facts);
    var links = element("td");
    if (entry.uia) {
      var uia = element("a", null, "UIA tree");
      uia.href = String(entry.uia);
      uia.target = "_blank";
      links.appendChild(uia);
    } else {
      links.appendChild(element("span", "empty", "none"));
    }
    row.appendChild(links);
    return row;
  }

  summary.textContent = "scenario " + String(data.scenario || "visual") +
    " | theme matrix " + String(data.themeMatrix || "unknown") +
    " | entries " + entries.length +
    " | product " + String(data.productHash || "unknown") +
    " | generated " + String(data.generatedUtc || "unknown") +
    " | synthetic " + threeState(data.synthetic);

  if (data.synthetic === true) {
    var banner = document.getElementById("banner");
    banner.hidden = false;
    banner.textContent = "Synthetic matrix: this matrix is marked as Synthetic demo data, and each " +
      "entry is labelled by its own source. A synthetic example is not a real product screenshot " +
      "and does not prove that any Visual gate passed.";
  }

  if (entries.length === 0) {
    host.appendChild(element("p", "empty", "No matrix entries were written."));
    return;
  }

  group(entries, "theme").forEach(function (themeGroup) {
    host.appendChild(element("h2", null, "Theme: " + themeGroup.name));
    group(themeGroup.items, "viewport").forEach(function (viewportGroup) {
      host.appendChild(element("h3", null, "Viewport: " + viewportGroup.name));
      group(viewportGroup.items, "page").forEach(function (pageGroup) {
        host.appendChild(element("h4", null, "Page: " + pageGroup.name));
        var table = element("table");
        var head = element("tr");
        ["State", "Status", "Screenshot", "Facts", "Evidence"].forEach(function (label) {
          head.appendChild(element("th", null, label));
        });
        table.appendChild(head);
        pageGroup.items.forEach(function (entry) { table.appendChild(renderEntry(entry)); });
        host.appendChild(table);
      });
    });
  });
}());
</script>
</body>
</html>
